services:
  postgres:
    image: "postgres:latest"
    environment:
     - POSTGRES_PASSWORD=2449
  backend:
    build:
      context: .
      dockerfile: ApiDockerfile
    image: "gradle:8.12.1-jdk17"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
    depends_on:
     - postgres
  web:
    build:
      context: .
      dockerfile: FrontDockerfile
    image: "node:latest"
    environment:
      - NODE_ENV=development
    depends_on:
     - backend
    ports:
     - "4200:4200"
