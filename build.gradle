plugins {
  id 'org.springframework.boot' version '3.4.1'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'com.diffplug.eclipse.apt' version '3.37.2'
}

apply plugin: 'eclipse'
apply plugin: 'java'
apply plugin: 'jacoco'

group = 'com.insurances'
version = '0.0.1'

java {
  sourceCompatibility = '17'
  targetCompatibility = '17'
}

repositories {
  mavenLocal()
  mavenCentral()
  gradlePluginPortal()
}

ext {
  vendors = [
    lombok: [
      version: '1.18.32'
    ],
    mapstruct: [
      version: '1.6.3'
    ],
    openapi:[
      version: '2.7.0'
    ],
    postgresql: [
      version: '42.7.5'
    ]
  ]
}

ext.libs = [
  lombok: [
    "org.projectlombok:lombok:${vendors.lombok.version}"
  ],
  mapstruct: [
    mapstruct: [
      "org.mapstruct:mapstruct:${vendors.mapstruct.version}"
    ],
    processor: [
      "org.mapstruct:mapstruct-processor:${vendors.mapstruct.version}"
    ]
  ],
  spring: [
    impl: [
      'org.springframework.boot:spring-boot-starter-web',
      'org.springframework.boot:spring-boot-starter-security',
      'org.springframework.boot:spring-boot-starter-validation',
      "org.springdoc:springdoc-openapi-starter-webmvc-ui:${vendors.openapi.version}",
      'org.springframework.boot:spring-boot-starter-data-jpa'
    ],
    test: [
      'org.springframework.boot:spring-boot-starter-test'
    ],
    development: [
      'org.springframework.boot:spring-boot-devtools'
    ]
  ]
]

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

dependencies {

  annotationProcessor libs.lombok
  annotationProcessor libs.mapstruct.processor

  compileOnly libs.lombok
  
  implementation libs.spring.impl, libs.mapstruct.mapstruct
  
  implementation 'joda-time:joda-time:2.13.0'
  implementation 'com.fasterxml.uuid:java-uuid-generator:5.1.0'
  implementation 'com.fasterxml.jackson.core:jackson-databind'
  implementation 'com.fasterxml.jackson.datatype:jackson-datatype-hibernate5'
  implementation 'javax.annotation:javax.annotation-api:1.3.2'
  implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
  implementation 'io.jsonwebtoken:jjwt:0.12.3'

  runtimeOnly "org.postgresql:postgresql:${vendors.postgresql.version}"

  testAnnotationProcessor libs.lombok
  testCompileOnly libs.lombok

  testImplementation libs.spring.test
  
  developmentOnly libs.spring.development
}

tasks.withType(JavaCompile) {
    options.annotationProcessorPath = configurations.annotationProcessor
}

sourceSets.main.java.srcDir "$buildDir/generated/sources/annotationProcessor/java/main"

test {
  useJUnitPlatform()
  finalizedBy jacocoTestReport
}

jacoco {
  toolVersion = "0.8.9"
}

jacocoTestCoverageVerification {
  violationRules {
    rule {
      limit {
        minimum = 0.5
      }
    }
    rule {
      enabled = false
      element = 'CLASS'
      includes = ['com.insurances.*']

      limit {
        counter = 'LINE'
        value = 'TOTALCOUNT'
        maximum = 0.3
      }
    }
  }
}

jacocoTestReport {
  dependsOn test
  reports {
    xml.required = false
    csv.required = false
    html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
  }
}


